<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>XYZ AI PRO MAX</title>

<link rel="icon" href="https://conventional-tan-epcphe3l.edgeone.app/file_00000000240471faa377abbcc19f3e9d.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#000">

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
    background:#000;
    color:#fff;
    overflow:hidden;
}

/* HEADER */
header{
    padding:12px;
    text-align:center;
    background:#111;
    border-bottom:1px solid #222;
    font-weight:600;
}

/* CHAT */
#chat{
    height: calc(100vh - 130px);
    overflow-y:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* ANIMATION */
@keyframes pop{
    from{transform:scale(0.85);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

.msg{
    max-width:75%;
    padding:10px 14px;
    border-radius:18px;
    font-size:14px;
    animation:pop 0.15s ease;
    word-wrap:break-word;
}

.user{
    background:#0a84ff;
    align-self:flex-end;
}

.ai{
    background:#2c2c2e;
    align-self:flex-start;
}

/* MEDIA */
.msg img{
    max-width:200px;
    border-radius:10px;
}

audio{
    width:200px;
}

/* INPUT BAR FIX */
#bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    align-items:center;
    padding:8px;
    gap:6px;
    background:#111;
    border-top:1px solid #222;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
}

/* INPUT */
input[type="text"]{
    flex:1;
    padding:10px;
    border-radius:20px;
    border:none;
    outline:none;
    background:#1c1c1e;
    color:#fff;
}

/* BUTTON */
button{
    background:#0a84ff;
    border:none;
    color:#fff;
    padding:10px 14px;
    border-radius:20px;
}

/* ICON BUTTON */
label{
    background:#333;
    padding:10px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

input[type="file"]{
    display:none;
}
</style>
</head>

<body>

<header>AI XYZ</header>

<div id="chat"></div>

<div id="bar">

<label>📷
<input type="file" accept="image/*" onchange="sendImage(event)">
</label>

<label>🎵
<input type="file" accept="audio/*" onchange="sendAudio(event)">
</label>

<label>📁
<input type="file" onchange="sendFile(event)">
</label>

<input id="text" placeholder="Tulis pesan..." />
<button onclick="send()">Kirim</button>

</div>

<script>

const chat = document.getElementById("chat");

/* 🔑 API KEY OPENROUTER */
const API_KEY = "
    "sk-or-v1-APIKEY_OPENROUTER_KAMU";

/* MODEL */
const MODEL = "openai/gpt-4o-mini";

/* ADD MESSAGE */
function add(content, type){
    const div = document.createElement("div");
    div.className = "msg "+type;

    if(typeof content === "string"){
        div.innerText = content;
    } else {
        div.appendChild(content);
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* AI */
async function ask(msg){

    if(!API_KEY || API_KEY.includes("ISI")){
        return "❌ Isi API key dulu";
    }

    try{
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer "+API_KEY,
                "HTTP-Referer":"http://localhost",
                "X-Title":"XYZ AI PRO MAX"
            },
            body:JSON.stringify({
                model:MODEL,
                messages:[{role:"user",content:msg}]
            })
        });

        const data = await res.json();

        return data.choices?.[0]?.message?.content || "❌ error API";

    }catch(e){
        return "❌ network error: "+e.message;
    }
}

/* SEND TEXT */
async function send(){
    const input = document.getElementById("text");
    const msg = input.value;
    if(!msg) return;

    add(msg,"user");
    input.value="";

    add("...", "ai");

    const reply = await ask(msg);

    chat.lastChild.remove();
    add(reply,"ai");
}

/* IMAGE */
function sendImage(e){
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(ev){
        const img = document.createElement("img");
        img.src = ev.target.result;

        add(img,"user");

        setTimeout(()=> add("📸 gambar diterima","ai"),400);
    }

    reader.readAsDataURL(file);
}

/* AUDIO */
function sendAudio(e){
    const file = e.target.files[0];
    if(!file) return;

    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = URL.createObjectURL(file);

    add(audio,"user");

    setTimeout(()=> add("🎵 audio diterima","ai"),400);
}

/* FILE */
function sendFile(e){
    const file = e.target.files[0];
    if(!file) return;

    const t = document.createElement("div");
    t.innerText = "📁 "+file.name;

    add(t,"user");

    setTimeout(()=> add("📂 file masuk","ai"),400);
}

</script>

</body>
  </html>
